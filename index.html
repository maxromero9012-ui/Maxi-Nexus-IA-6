<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maxi IA</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Maxi IA - Asistente de programación" />

  <style>
    /* ====== ESTILOS (mismos que antes, solo añado clase para micrófono) ====== */
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-glass: rgba(0,0,0,0.85);
      --bg-card: rgba(20,20,30,0.5);
      --bg-input: rgba(255,255,255,0.05);
      --bg-hover: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #a8a8c8;
      --text-muted: #6a6a8a;
      --accent: #7c6df0;
      --accent-glow: rgba(124,109,240,0.25);
      --accent-soft: #9b8cf5;
      --border-glass: rgba(255,255,255,0.06);
      --shadow-soft: 0 8px 32px rgba(0,0,0,0.8);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --radius-xs: 6px;
      --font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
      --sidebar-width: 280px;
    }

    @media (prefers-color-scheme: light) {
      :root:not(.dark) {
        --bg-primary: #f5f5f7;
        --bg-secondary: #e8e8ed;
        --bg-glass: rgba(255,255,255,0.85);
        --bg-card: rgba(240,240,245,0.7);
        --bg-input: rgba(0,0,0,0.05);
        --bg-hover: rgba(0,0,0,0.06);
        --text-primary: #1a1a1a;
        --text-secondary: #3a3a4a;
        --text-muted: #6a6a7a;
        --border-glass: rgba(0,0,0,0.08);
        --shadow-soft: 0 8px 32px rgba(0,0,0,0.15);
      }
    }
    :root.dark {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0a;
      --bg-glass: rgba(0,0,0,0.85);
      --bg-card: rgba(20,20,30,0.5);
      --bg-input: rgba(255,255,255,0.05);
      --bg-hover: rgba(255,255,255,0.08);
      --text-primary: #f0f0f5;
      --text-secondary: #a8a8c8;
      --text-muted: #6a6a8a;
      --border-glass: rgba(255,255,255,0.06);
      --shadow-soft: 0 8px 32px rgba(0,0,0,0.8);
    }
    :root.light {
      --bg-primary: #f5f5f7;
      --bg-secondary: #e8e8ed;
      --bg-glass: rgba(255,255,255,0.85);
      --bg-card: rgba(240,240,245,0.7);
      --bg-input: rgba(0,0,0,0.05);
      --bg-hover: rgba(0,0,0,0.06);
      --text-primary: #1a1a1a;
      --text-secondary: #3a3a4a;
      --text-muted: #6a6a7a;
      --border-glass: rgba(0,0,0,0.08);
      --shadow-soft: 0 8px 32px rgba(0,0,0,0.15);
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    html, body { height:100%; font-family:var(--font); background:var(--bg-primary); color:var(--text-primary); overflow:hidden; -webkit-tap-highlight-color:transparent; }

    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:10px; }

    .app { display:flex; height:100vh; width:100vw; overflow:hidden; position:relative; }

    /* Sidebar */
    .sidebar {
      position:fixed; top:0; left:0; width:var(--sidebar-width); height:100%;
      background:var(--bg-glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-right:1px solid var(--border-glass);
      padding:24px 16px; display:flex; flex-direction:column; gap:12px;
      transform:translateX(-100%); transition:transform var(--transition);
      z-index:1000; box-shadow:var(--shadow-soft);
    }
    .sidebar.open { transform:translateX(0); }

    .sidebar-brand { display:flex; align-items:center; gap:12px; padding-bottom:20px; border-bottom:1px solid var(--border-glass); }
    .sidebar-brand .logo { width:32px; height:32px; fill:var(--accent); }
    .sidebar-brand h1 { font-size:20px; font-weight:600; background:linear-gradient(135deg,var(--accent),var(--accent-soft)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

    .sidebar-nav { display:flex; flex-direction:column; gap:6px; flex:1; overflow-y:auto; padding-right:4px; }
    .sidebar-nav button { display:flex; align-items:center; gap:14px; width:100%; padding:12px 16px; border:none; border-radius:var(--radius-sm); background:transparent; color:var(--text-secondary); font-size:15px; font-weight:500; cursor:pointer; transition:background var(--transition), color var(--transition); text-align:left; font-family:inherit; }
    .sidebar-nav button:hover { background:var(--bg-hover); color:var(--text-primary); }
    .sidebar-nav button .icon { width:22px; height:22px; fill:currentColor; flex-shrink:0; }
    .sidebar-nav .active { background:var(--accent-glow); color:var(--accent-soft); }

    .chat-history-list { display:flex; flex-direction:column; gap:4px; margin-top:8px; padding-left:8px; border-left:1px solid var(--border-glass); max-height:300px; overflow-y:auto; }
    .chat-history-item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-radius:var(--radius-xs); cursor:pointer; transition:background var(--transition); font-size:14px; color:var(--text-secondary); user-select:none; }
    .chat-history-item:hover { background:var(--bg-hover); color:var(--text-primary); }
    .chat-history-item .title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:8px; }

    .sidebar-footer { border-top:1px solid var(--border-glass); padding-top:16px; margin-top:auto; font-size:13px; color:var(--text-muted); text-align:center; }

    .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:999; opacity:0; pointer-events:none; transition:opacity var(--transition); }
    .sidebar-overlay.visible { opacity:1; pointer-events:auto; }

    .chat-main { flex:1; display:flex; flex-direction:column; height:100vh; width:100%; background:var(--bg-primary); position:relative; }

    .chat-header { display:flex; align-items:center; padding:12px 20px; background:var(--bg-glass); backdrop-filter:blur(12px); border-bottom:1px solid var(--border-glass); gap:12px; flex-shrink:0; min-height:64px; }
    .chat-header .menu-btn { background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:4px; border-radius:var(--radius-xs); transition:background var(--transition); display:flex; align-items:center; justify-content:center; width:40px; height:40px; }
    .chat-header .menu-btn:hover { background:var(--bg-hover); }
    .chat-header .menu-btn svg { width:24px; height:24px; fill:currentColor; }
    .chat-header .title { font-size:18px; font-weight:600; flex:1; }
    .chat-header .title span { background:linear-gradient(135deg,var(--accent),var(--accent-soft)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .chat-header .badge { font-size:12px; background:var(--accent-glow); color:var(--accent-soft); padding:4px 12px; border-radius:20px; font-weight:500; }
    .chat-header .header-actions { display:flex; gap:6px; }
    .chat-header .header-actions button { background:var(--bg-hover); border:none; color:var(--text-secondary); padding:6px 10px; border-radius:var(--radius-xs); cursor:pointer; font-size:13px; transition:background var(--transition); display:flex; align-items:center; gap:4px; }
    .chat-header .header-actions button:hover { background:var(--bg-input); color:var(--text-primary); }
    .chat-header .header-actions button svg { width:18px; height:18px; fill:currentColor; }

    .messages-container { flex:1; overflow-y:auto; padding:20px 16px 12px; display:flex; flex-direction:column; gap:6px; scroll-behavior:smooth; }

    .welcome-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; animation:fadeUp 0.6s ease-out; }
    .welcome-screen .logo-big { width:80px; height:80px; fill:var(--accent); margin-bottom:16px; }
    .welcome-screen h2 { font-size:32px; font-weight:700; background:linear-gradient(135deg,#fff,var(--accent-soft)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .welcome-screen .sub { font-size:18px; color:var(--text-secondary); margin-top:4px; }
    .welcome-screen .desc { margin-top:20px; color:var(--text-muted); font-size:15px; max-width:420px; line-height:1.6; background:var(--bg-glass); backdrop-filter:blur(8px); padding:16px 28px; border-radius:var(--radius-lg); border:1px solid var(--border-glass); }
    .welcome-screen .desc strong { color:var(--text-secondary); }

    .message { display:flex; flex-direction:column; max-width:82%; animation:messageIn 0.3s ease-out; margin-bottom:4px; }
    .message.user { align-self:flex-end; align-items:flex-end; }
    .message.assistant { align-self:flex-start; align-items:flex-start; }
    .message .bubble { padding:6px 12px; word-wrap:break-word; white-space:pre-wrap; line-height:1.6; font-size:15px; background:transparent !important; border:none !important; color:var(--text-primary); }
    .message.user .bubble { color:var(--accent-soft); text-align:right; }
    .message .meta { display:flex; align-items:center; gap:10px; margin-top:2px; font-size:12px; color:var(--text-muted); padding:0 6px; }
    .message .meta .time { font-size:11px; }
    .message .actions { display:flex; gap:6px; opacity:0; transition:opacity 0.2s; }
    .message:hover .actions, .message .actions:focus-within { opacity:1; }
    .message .actions button { background:var(--bg-glass); border:1px solid var(--border-glass); color:var(--text-secondary); padding:4px 8px; border-radius:var(--radius-xs); cursor:pointer; font-size:13px; transition:background var(--transition), color var(--transition); display:inline-flex; align-items:center; gap:4px; }
    .message .actions button:hover { background:var(--bg-hover); color:var(--text-primary); }
    .message .actions button .label { font-size:11px; font-weight:500; }
    .message .actions button svg { width:16px; height:16px; fill:currentColor; }

    .typing-indicator { display:none; align-self:flex-start; padding:10px 18px; background:var(--bg-glass); backdrop-filter:blur(8px); border-radius:var(--radius-lg); border:1px solid var(--border-glass); border-bottom-left-radius:4px; gap:6px; align-items:center; margin-bottom:4px; }
    .typing-indicator.active { display:flex; }
    .typing-indicator .dots { display:flex; gap:4px; }
    .typing-indicator .dots span { width:8px; height:8px; border-radius:50%; background:var(--text-muted); animation:dotPulse 1.4s infinite both; }
    .typing-indicator .dots span:nth-child(2) { animation-delay:0.2s; }
    .typing-indicator .dots span:nth-child(3) { animation-delay:0.4s; }
    .typing-indicator .text { font-size:14px; color:var(--text-secondary); }

    .input-area { padding:12px 16px 16px; background:var(--bg-glass); backdrop-filter:blur(12px); border-top:1px solid var(--border-glass); flex-shrink:0; }
    .input-wrapper { display:flex; align-items:flex-end; gap:10px; background:var(--bg-input); border-radius:var(--radius-lg); padding:6px 8px 6px 16px; border:1px solid var(--border-glass); transition:border-color var(--transition), box-shadow var(--transition); backdrop-filter:blur(4px); }
    .input-wrapper:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }
    .input-wrapper textarea { flex:1; background:transparent; border:none; outline:none; color:var(--text-primary); font-family:inherit; font-size:15px; resize:none; padding:8px 0; min-height:24px; max-height:150px; line-height:1.5; width:0; }
    .input-wrapper textarea::placeholder { color:var(--text-muted); }
    .input-wrapper .btn-icon { background:none; border:none; color:var(--text-muted); cursor:pointer; padding:6px; border-radius:var(--radius-xs); transition:background var(--transition), color var(--transition); display:flex; align-items:center; justify-content:center; flex-shrink:0; width:40px; height:40px; }
    .input-wrapper .btn-icon:hover { background:var(--bg-hover); color:var(--text-primary); }
    .input-wrapper .btn-icon svg { width:22px; height:22px; fill:currentColor; }
    .input-wrapper .btn-icon.send { color:var(--accent); background:var(--accent-glow); border-radius:50%; width:44px; height:44px; transition:background var(--transition), transform 0.15s; }
    .input-wrapper .btn-icon.send:hover { background:rgba(124,109,240,0.35); transform:scale(1.05); }
    .input-wrapper .btn-icon.send:active { transform:scale(0.92); }
    .input-wrapper .file-input { display:none; }
    /* Micrófono con clase recording */
    .btn-mic.recording { color:#ff4444 !important; background:rgba(255,68,68,0.15) !important; animation:pulse-mic 0.8s infinite; }
    @keyframes pulse-mic { 0% { transform:scale(1); } 50% { transform:scale(1.1); } 100% { transform:scale(1); } }

    .toast { position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-card); backdrop-filter:blur(16px); border:1px solid var(--border-glass); padding:10px 24px; border-radius:var(--radius-lg); color:var(--text-secondary); font-size:14px; box-shadow:var(--shadow-soft); opacity:0; pointer-events:none; transition:opacity 0.3s, transform 0.3s; z-index:2000; }
    .toast.visible { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(6px); z-index:3000; display:none; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.active { display:flex; }
    .modal-box { background:var(--bg-glass); backdrop-filter:blur(20px); border:1px solid var(--border-glass); border-radius:var(--radius-lg); padding:32px; max-width:480px; width:100%; box-shadow:var(--shadow-soft); animation:fadeUp 0.3s ease-out; }
    .modal-box h2 { font-size:24px; margin-bottom:12px; color:var(--text-primary); }
    .modal-box p { color:var(--text-secondary); line-height:1.6; margin-bottom:20px; }
    .modal-box input, .modal-box select { width:100%; padding:12px 16px; background:var(--bg-input); border:1px solid var(--border-glass); border-radius:var(--radius-sm); color:var(--text-primary); font-size:15px; font-family:inherit; outline:none; transition:border-color var(--transition); margin-bottom:16px; }
    .modal-box input:focus, .modal-box select:focus { border-color:var(--accent); }
    .modal-box .modal-actions { display:flex; gap:10px; justify-content:flex-end; }
    .modal-box .modal-actions button { padding:10px 24px; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:600; cursor:pointer; transition:background var(--transition); }
    .modal-box .modal-actions .btn-primary { background:var(--accent); color:#fff; }
    .modal-box .modal-actions .btn-primary:hover { background:var(--accent-soft); }
    .modal-box .modal-actions .btn-secondary { background:var(--bg-hover); color:var(--text-secondary); }
    .modal-box .modal-actions .btn-secondary:hover { background:var(--bg-input); }

    .context-menu { position:fixed; background:var(--bg-glass); backdrop-filter:blur(20px); border:1px solid var(--border-glass); border-radius:var(--radius-md); padding:8px; box-shadow:var(--shadow-soft); z-index:5000; min-width:160px; display:none; animation:fadeUp 0.15s ease-out; }
    .context-menu button { display:flex; align-items:center; gap:10px; width:100%; padding:10px 14px; border:none; background:transparent; color:var(--text-secondary); font-size:14px; font-family:inherit; cursor:pointer; border-radius:var(--radius-xs); transition:background var(--transition), color var(--transition); text-align:left; }
    .context-menu button:hover { background:var(--bg-hover); color:var(--text-primary); }
    .context-menu button.danger { color:#ff6b6b; }
    .context-menu button.danger:hover { background:rgba(255,107,107,0.15); }
    .context-menu button svg { width:18px; height:18px; fill:currentColor; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes messageIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes dotPulse { 0%,80%,100% { transform:scale(0.6); opacity:0.4; } 30% { transform:scale(1); opacity:1; } }

    .hidden { display:none !important; }

    @media (max-width:768px) {
      .message { max-width:90%; }
      .welcome-screen h2 { font-size:26px; }
      .welcome-screen .desc { font-size:14px; padding:14px 20px; }
      .input-wrapper { padding:4px 6px 4px 14px; }
      .input-wrapper .btn-icon { width:36px; height:36px; }
      .input-wrapper .btn-icon.send { width:40px; height:40px; }
      .chat-header .badge { font-size:10px; padding:2px 10px; }
      .chat-header .header-actions button { font-size:12px; padding:4px 6px; }
    }
    @media (min-width:769px) {
      .sidebar { transform:translateX(0) !important; position:relative; z-index:auto; box-shadow:none; border-right:1px solid var(--border-glass); background:var(--bg-glass); backdrop-filter:blur(20px); }
      .sidebar-overlay { display:none !important; }
      .chat-main { margin-left:0; }
      .chat-header .menu-btn { display:none; }
    }
  </style>
</head>
<body>

  <!-- Toast, Context Menu, Modal (igual que antes) -->
  <div id="toast" class="toast" role="status"></div>
  <div id="contextMenu" class="context-menu">
    <button id="contextRename"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg> Renombrar</button>
    <button id="contextDelete" class="danger"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> Eliminar</button>
  </div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal-box">
      <h2 id="modalTitle">Título</h2>
      <p id="modalContent">Contenido</p>
      <div id="modalExtra" style="display:none;"><input type="text" id="modalInput" placeholder="Nuevo nombre..." /></div>
      <div id="modalExtraSelect" style="display:none;"><select id="modalSelect"></select></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="modalCancelBtn">Cancelar</button>
        <button class="btn-primary" id="modalConfirmBtn">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- App -->
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <svg class="logo" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <h1>Maxi IA</h1>
      </div>
      <nav class="sidebar-nav">
        <button id="navNewChat" class="active"><svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Nuevo chat</button>
        <button id="navHistoryToggle"><svg class="icon" viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg> Historial</button>
        <div id="historyList" class="chat-history-list" style="display:none;"></div>
        <button id="navSettings"><svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg> Configuración</button>
        <button id="navInfo"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg> Información</button>
      </nav>
      <div class="sidebar-footer">Maxi IA v2.2 (respuestas cortas)</div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <main class="chat-main">
      <header class="chat-header">
        <button class="menu-btn" id="menuToggle"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>

  <!-- ============================================================
  SCRIPT COMPLETO (con respuestas cortas, micrófono SVG y lectura de archivos)
  ============================================================ -->
  <script type="module">
    // ------------------------------------------------------------
    // i18n: Traducciones (cortas)
    // ------------------------------------------------------------
    const translations = {
      es: { title:'Maxi IA', newChat:'Nuevo chat', history:'Historial', settings:'Configuración', info:'Información', noChats:'No hay conversaciones', rename:'Renombrar', delete:'Eliminar', confirmDelete:'¿Eliminar el chat "{title}"?', copied:'Copiado al portapapeles', error:'Error', retrying:'Reintentando...', offline:'Sin conexión', typePlaceholder:'Escribe tu mensaje...', listening:'Escuchando...', send:'Enviar', attach:'Adjuntar', mic:'Micrófono', exportChat:'Exportar chat', exportJSON:'JSON', exportMarkdown:'Markdown', theme:'Tema', light:'Claro', dark:'Oscuro', auto:'Automático', language:'Idioma', pin:'PIN de seguridad', setPin:'Establecer PIN (4 dígitos)', enterPin:'Introduce tu PIN', wrongPin:'PIN incorrecto', pinEnabled:'PIN habilitado', pinDisabled:'PIN deshabilitado', rateLimit:'Espera un momento.', charLimit:'Máximo 2000 caracteres.' },
      en: { title:'Maxi IA', newChat:'New chat', history:'History', settings:'Settings', info:'Info', noChats:'No conversations', rename:'Rename', delete:'Delete', confirmDelete:'Delete chat "{title}"?', copied:'Copied to clipboard', error:'Error', retrying:'Retrying...', offline:'Offline', typePlaceholder:'Type your message...', listening:'Listening...', send:'Send', attach:'Attach', mic:'Microphone', exportChat:'Export chat', exportJSON:'JSON', exportMarkdown:'Markdown', theme:'Theme', light:'Light', dark:'Dark', auto:'Auto', language:'Language', pin:'Security PIN', setPin:'Set PIN (4 digits)', enterPin:'Enter your PIN', wrongPin:'Wrong PIN', pinEnabled:'PIN enabled', pinDisabled:'PIN disabled', rateLimit:'Please wait.', charLimit:'Max 2000 characters.' },
      pt: { title:'Maxi IA', newChat:'Novo chat', history:'Histórico', settings:'Configurações', info:'Informações', noChats:'Sem conversas', rename:'Renomear', delete:'Excluir', confirmDelete:'Excluir chat "{title}"?', copied:'Copiado', error:'Erro', retrying:'Tentando...', offline:'Offline', typePlaceholder:'Digite sua mensagem...', listening:'Ouvindo...', send:'Enviar', attach:'Anexar', mic:'Microfone', exportChat:'Exportar chat', exportJSON:'JSON', exportMarkdown:'Markdown', theme:'Tema', light:'Claro', dark:'Escuro', auto:'Automático', language:'Idioma', pin:'PIN de segurança', setPin:'Definir PIN (4 dígitos)', enterPin:'Digite seu PIN', wrongPin:'PIN incorreto', pinEnabled:'PIN ativado', pinDisabled:'PIN desativado', rateLimit:'Aguarde um momento.', charLimit:'Máximo 2000 caracteres.' }
    };
    let currentLang = 'es';
    function t(key) { return translations[currentLang]?.[key] || translations.es[key] || key; }

    // ------------------------------------------------------------
    // Configuración (IndexedDB) - igual que antes
    // ------------------------------------------------------------
    const CONFIG_STORE = 'config';
    async function getConfig() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(CONFIG_STORE, 'readonly');
        const store = tx.objectStore(CONFIG_STORE);
        const req = store.get('userConfig');
        req.onsuccess = () => resolve(req.result?.value || {});
        req.onerror = () => resolve({});
      });
    }
    async function setConfig(key, value) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction(CONFIG_STORE, 'readwrite');
        const store = tx.objectStore(CONFIG_STORE);
        const req = store.get('userConfig');
        req.onsuccess = async () => {
          const data = req.result || { id: 'userConfig', value: {} };
          data.value[key] = value;
          store.put(data);
          resolve();
        };
        req.onerror = () => resolve();
      });
    }

    // ------------------------------------------------------------
    // IndexedDB (chats, caché, config)
    // ------------------------------------------------------------
    const DB_NAME = 'MaxiIA_Chats';
    const DB_VERSION = 2;

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('chats')) {
            const store = db.createObjectStore('chats', { keyPath: 'id' });
            store.createIndex('timestamp', 'timestamp', { unique: false });
            store.createIndex('title', 'title', { unique: false });
          }
          if (!db.objectStoreNames.contains('cache')) {
            const cacheStore = db.createObjectStore('cache', { keyPath: 'id' });
            cacheStore.createIndex('prompt', 'prompt', { unique: false });
          }
          if (!db.objectStoreNames.contains('config')) {
            db.createObjectStore('config', { keyPath: 'id' });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function saveChat(chat) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readwrite');
        const store = tx.objectStore('chats');
        const req = store.put(chat);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function getAllChats() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readonly');
        const store = tx.objectStore('chats');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function deleteChat(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readwrite');
        const store = tx.objectStore('chats');
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }
    async function getChat(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('chats', 'readonly');
        const store = tx.objectStore('chats');
        const req = store.get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // Caché de respuestas
    async function saveCache(prompt, response) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('cache', 'readwrite');
        const store = tx.objectStore('cache');
        store.put({ id: `cache_${Date.now()}`, prompt, response, timestamp: Date.now() });
        resolve();
      });
    }
    async function getCachedResponse(prompt) {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('cache', 'readonly');
        const store = tx.objectStore('cache');
        const index = store.index('prompt');
        const range = IDBKeyRange.bound(prompt, prompt + '\uffff');
        const req = index.openCursor(range);
        let best = null;
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) { best = cursor.value; resolve(best); } else { resolve(null); }
        };
        req.onerror = () => resolve(null);
      });
    }

    // ------------------------------------------------------------
    // API (Pollinations con PROMPT CORTO)
    // ------------------------------------------------------------
    const POLLINATIONS_URL = 'https://text.pollinations.ai/';
    const DEFAULT_MODEL = 'openai';
    const MAX_RETRIES = 3;
    const RETRY_DELAY = 1000;

    async function getAIResponseWithRetry(messages, retries = 0) {
      const lastUserMsg = messages.filter(m => m.role === 'user').pop();
      if (!lastUserMsg) return 'No hay mensaje para procesar.';

      const lower = lastUserMsg.content.toLowerCase();
      if (lower.includes('hola') || lower.includes('buenas') || lower.includes('saludos')) {
        return '¡Hola! ¿Qué necesitas resolver hoy?';
      }
      if (lower.includes('gracias') || lower.includes('agradezco')) {
        return '¡De nada! ¿Algo más en lo que pueda ayudarte?';
      }

      const cached = await getCachedResponse(lastUserMsg.content);
      if (cached) return cached.response;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);
      try {
        const payload = {
          messages: [
            { role: 'system', content: 'Eres Maxi IA, un asistente experto en programación. Responde SIEMPRE de forma breve, clara y directa. Máximo 150 palabras o 5 viñetas. Usa lenguaje sencillo.' },
            ...messages
          ],
          model: DEFAULT_MODEL,
          temperature: 0.7,
        };
        const response = await fetch(POLLINATIONS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });
        clearTimeout(timeoutId);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const clean = text.trim() || 'Lo siento, no pude procesar tu pregunta. Intenta de nuevo.';
        await saveCache(lastUserMsg.content, clean);
        return clean;
      } catch (error) {
        clearTimeout(timeoutId);
        if (error.name === 'AbortError') {
          if (retries < MAX_RETRIES) {
            await new Promise(r => setTimeout(r, RETRY_DELAY * (retries + 1)));
            return getAIResponseWithRetry(messages, retries + 1);
          }
          return '⏱️ Tiempo de espera agotado después de varios intentos.';
        }
        console.error('[Pollinations] Error:', error);
        if (retries < MAX_RETRIES) {
          await new Promise(r => setTimeout(r, RETRY_DELAY * (retries + 1)));
          return getAIResponseWithRetry(messages, retries + 1);
        }
        return '❌ Error de conexión persistente. Verifica tu red.';
      }
    }

    // ------------------------------------------------------------
    // UI: Estado y renderizado
    // ------------------------------------------------------------
    const state = {
      currentChatId: null,
      messages: [],
      isProcessing: false,
      isSaved: false,
      contextChatId: null,
      lastSendTime: 0,
    };

    const $ = (id) => document.getElementById(id);
    const messagesContainer = $('messagesContainer');
    const welcomeScreen = $('welcomeScreen');
    const typingIndicator = $('typingIndicator');
    const messageInput = $('messageInput');
    const sendBtn = $('sendBtn');
    const attachBtn = $('attachBtn');
    const fileInput = $('fileInput');
    const micBtn = $('micBtn');
    const menuToggle = $('menuToggle');
    const sidebar = $('sidebar');
    const sidebarOverlay = $('sidebarOverlay');
    const toast = $('toast');
    const modalOverlay = $('modalOverlay');
    const modalTitle = $('modalTitle');
    const modalContent = $('modalContent');
    const modalExtra = $('modalExtra');
    const modalExtraSelect = $('modalExtraSelect');
    const modalInput = $('modalInput');
    const modalSelect = $('modalSelect');
    const modalConfirmBtn = $('modalConfirmBtn');
    const modalCancelBtn = $('modalCancelBtn');
    const contextMenu = $('contextMenu');
    const contextRename = $('contextRename');
    const contextDelete = $('contextDelete');
    const navNewChat = $('navNewChat');
    const navHistoryToggle = $('navHistoryToggle');
    const historyList = $('historyList');
    const navSettings = $('navSettings');
    const navInfo = $('navInfo');
    const btnExportChat = $('btnExportChat');

    function getTime() {
      return new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    }

    function showToast(msg, duration = 2200) {
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('visible'), duration);
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      });
    }

    function generateChatTitle(messages) {
      const firstUserMsg = messages.find(m => m.role === 'user');
      if (firstUserMsg) {
        let title = firstUserMsg.content;
        if (title.length > 40) title = title.substring(0, 40) + '…';
        return title;
      }
      return 'Chat sin título';
    }

    // Renderizado de mensajes
    function createMessageElement(role, content, time) {
      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;

      const meta = document.createElement('div');
      meta.className = 'meta';
      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = time || getTime();

      const actions = document.createElement('div');
      actions.className = 'actions';

      if (role === 'assistant') {
        const copyBtn = document.createElement('button');
        copyBtn.setAttribute('aria-label', 'Copiar respuesta');
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg><span class="label">Copiar</span>`;
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(content).then(() => showToast(t('copied'))).catch(() => {
            const ta = document.createElement('textarea');
            ta.value = content;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(t('copied'));
          });
        });

        const regenBtn = document.createElement('button');
        regenBtn.setAttribute('aria-label', 'Regenerar respuesta');
        regenBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg><span class="label">Regenerar</span>`;
        regenBtn.addEventListener('click', () => {
          const idx = state.messages.findIndex(m => m.content === content && m.role === 'assistant');
          if (idx !== -1) {
            state.messages.splice(idx, 1);
            wrapper.remove();
            const lastUser = [...state.messages].reverse().find(m => m.role === 'user');
            if (lastUser) {
              simulateAssistantResponse(lastUser.content);
            }
          }
        });

        actions.append(copyBtn, regenBtn);
      }

      meta.append(timeSpan, actions);
      wrapper.append(bubble, meta);
      return wrapper;
    }

    function renderAllMessages() {
      const children = messagesContainer.children;
      for (let i = children.length - 1; i >= 0; i--) {
        const el = children[i];
        if (el.id === 'welcomeScreen' || el.id === 'typingIndicator') continue;
        el.remove();
      }
      const typingEl = document.getElementById('typingIndicator');
      state.messages.forEach(msg => {
        const el = createMessageElement(msg.role, msg.content, msg.time);
        messagesContainer.insertBefore(el, typingEl);
      });
      if (state.messages.length > 0) welcomeScreen.classList.add('hidden');
      else welcomeScreen.classList.remove('hidden');
      scrollToBottom();
    }

    function addMessage(role, content, time) {
      const msg = { role, content, time: time || getTime() };
      state.messages.push(msg);
      state.isSaved = false;
      const typingEl = document.getElementById('typingIndicator');
      const el = createMessageElement(role, content, msg.time);
      messagesContainer.insertBefore(el, typingEl);
      if (state.messages.length > 0) welcomeScreen.classList.add('hidden');
      scrollToBottom();
      return el;
    }

    // ------------------------------------------------------------
    // Gestión de chats
    // ------------------------------------------------------------
    async function saveCurrentChat() {
      if (state.messages.length === 0) return null;
      const allChats = await getAllChats();
      if (allChats.length >= 100) {
        showToast('⚠️ Has alcanzado el límite de 100 chats. Elimina algunos para guardar este.');
        return null;
      }
      const title = generateChatTitle(state.messages);
      const chat = {
        id: state.currentChatId || `chat_${Date.now()}`,
        title: title,
        timestamp: Date.now(),
        messages: state.messages.slice(),
      };
      await saveChat(chat);
      state.currentChatId = chat.id;
      state.isSaved = true;
      return chat;
    }

    async function loadChat(id) {
      const chat = await getChat(id);
      if (!chat) return null;
      state.currentChatId = chat.id;
      state.messages = chat.messages.slice();
      state.isSaved = true;
      renderAllMessages();
      if (window.innerWidth <= 768) toggleSidebar(false);
      return chat;
    }

    async function deleteChatAndRefresh(id) {
      await deleteChat(id);
      if (state.currentChatId === id) {
        state.currentChatId = null;
        state.messages = [];
        state.isSaved = false;
        renderAllMessages();
      }
      await renderHistoryList();
      showToast('🗑️ Chat eliminado');
    }

    async function renameChat(id, newTitle) {
      const chat = await getChat(id);
      if (!chat) return;
      chat.title = newTitle.trim() || 'Chat sin título';
      await saveChat(chat);
      await renderHistoryList();
      showToast('✏️ Chat renombrado');
    }

    // ------------------------------------------------------------
    // Respuesta de IA con contexto y PROMPT CORTO
    // ------------------------------------------------------------
    async function simulateAssistantResponse(userMessage) {
      if (state.isProcessing) return;
      const now = Date.now();
      if (now - state.lastSendTime < 2000) {
        showToast(t('rateLimit'));
        return;
      }
      state.lastSendTime = now;
      state.isProcessing = true;
      typingIndicator.classList.add('active');
      scrollToBottom();

      // Construir historial
      const historialParaAPI = state.messages.map(msg => ({
        role: msg.role === 'user' ? 'user' : 'assistant',
        content: msg.content
      }));

      const respuesta = await getAIResponseWithRetry(historialParaAPI);
      typingIndicator.classList.remove('active');

      const time = getTime();
      const msgObj = { role: 'assistant', content: '', time };
      state.messages.push(msgObj);
      state.isSaved = false;

      const typingEl = document.getElementById('typingIndicator');
      const wrapper = document.createElement('div');
      wrapper.className = 'message assistant';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const meta = document.createElement('div');
      meta.className = 'meta';
      const timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = time;
      const actions = document.createElement('div');
      actions.className = 'actions';

      // Botones
      const copyBtn = document.createElement('button');
      copyBtn.setAttribute('aria-label', 'Copiar respuesta');
      copyBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg><span class="label">Copiar</span>`;
      copyBtn.addEventListener('click', () => {
        const content = bubble.textContent;
        navigator.clipboard.writeText(content).then(() => showToast(t('copied'))).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = content;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(t('copied'));
        });
      });

      const regenBtn = document.createElement('button');
      regenBtn.setAttribute('aria-label', 'Regenerar respuesta');
      regenBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg><span class="label">Regenerar</span>`;
      regenBtn.addEventListener('click', () => {
        const idx = state.messages.findIndex(m => m.content === bubble.textContent && m.role === 'assistant');
        if (idx !== -1) {
          state.messages.splice(idx, 1);
          wrapper.remove();
          const lastUser = [...state.messages].reverse().find(m => m.role === 'user');
          if (lastUser) {
            simulateAssistantResponse(lastUser.content);
          }
        }
      });

      actions.append(copyBtn, regenBtn);
      meta.append(timeSpan, actions);
      wrapper.append(bubble, meta);
      messagesContainer.insertBefore(wrapper, typingEl);

      let index = 0;
      const interval = setInterval(() => {
        if (index < respuesta.length) {
          bubble.textContent += respuesta.charAt(index);
          index++;
          const msg = state.messages.find(m => m.content === '' && m.role === 'assistant');
          if (msg) msg.content = bubble.textContent;
          scrollToBottom();
        } else {
          clearInterval(interval);
          const msg = state.messages.find(m => m.content === '' && m.role === 'assistant');
          if (msg) msg.content = respuesta;
          state.isProcessing = false;
          actions.style.opacity = '1';
          autoSaveChat();
        }
      }, 20 + Math.random() * 10);
      scrollToBottom();
    }

    // ------------------------------------------------------------
    // Auto-guardado
    // ------------------------------------------------------------
    let saveTimeout = null;
    function autoSaveChat() {
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        if (state.messages.length > 0 && !state.isSaved) {
          await saveCurrentChat();
          await renderHistoryList();
        }
      }, 1000);
    }

    async function startNewChat() {
      if (state.messages.length > 0 && !state.isSaved) {
        await saveCurrentChat();
        await renderHistoryList();
      }
      state.currentChatId = null;
      state.messages = [];
      state.isSaved = false;
      state.isProcessing = false;
      renderAllMessages();
      if (window.innerWidth <= 768) toggleSidebar(false);
      messageInput.focus();
      showToast('✨ Nuevo chat iniciado');
    }

    // ------------------------------------------------------------
    // Historial con long press
    // ------------------------------------------------------------
    let longPressTimer = null;
    let longPressTriggered = false;

    function setupHistoryItemEvents(item, chatId) {
      item.addEventListener('click', () => {
        if (longPressTriggered) { longPressTriggered = false; return; }
        if (state.messages.length > 0 && !state.isSaved) {
          saveCurrentChat().then(() => renderHistoryList());
        }
        loadChat(chatId);
        if (window.innerWidth <= 768) historyList.style.display = 'none';
      });
      item.addEventListener('pointerdown', (e) => {
        longPressTriggered = false;
        longPressTimer = setTimeout(() => {
          longPressTriggered = true;
          showContextMenu(e.clientX, e.clientY, chatId);
        }, 600);
      });
      item.addEventListener('pointerup', () => clearTimeout(longPressTimer));
      item.addEventListener('pointerleave', () => clearTimeout(longPressTimer));
      item.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    function showContextMenu(x, y, chatId) {
      state.contextChatId = chatId;
      contextMenu.style.display = 'block';
      contextMenu.style.left = Math.min(x, window.innerWidth - 180) + 'px';
      contextMenu.style.top = Math.min(y, window.innerHeight - 120) + 'px';
      clearTimeout(contextMenu._hideTimer);
      contextMenu._hideTimer = setTimeout(() => { contextMenu.style.display = 'none'; }, 5000);
    }
    function hideContextMenu() { contextMenu.style.display = 'none'; state.contextChatId = null; }

    async function renderHistoryList() {
      const chats = await getAllChats();
      chats.sort((a, b) => b.timestamp - a.timestamp);
      historyList.innerHTML = '';
      if (chats.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'chat-history-item';
        empty.textContent = t('noChats');
        empty.style.color = 'var(--text-muted)';
        empty.style.fontStyle = 'italic';
        empty.style.cursor = 'default';
        historyList.appendChild(empty);
      } else {
        chats.forEach(chat => {
          const item = document.createElement('div');
          item.className = 'chat-history-item';
          const titleSpan = document.createElement('span');
          titleSpan.className = 'title';
          titleSpan.textContent = chat.title;
          titleSpan.title = chat.title;
          item.append(titleSpan);
          historyList.appendChild(item);
          setupHistoryItemEvents(item, chat.id);
        });
      }
    }

    // Exportar chat
    async function exportChat(format) {
      if (state.messages.length === 0) { showToast('No hay mensajes para exportar.'); return; }
      const chat = await getChat(state.currentChatId);
      if (!chat) { showToast('Error: no se encontró el chat.'); return; }
      let content = '';
      if (format === 'json') {
        content = JSON.stringify(chat, null, 2);
        downloadFile(content, `chat_${chat.title}.json`, 'application/json');
      } else if (format === 'markdown') {
        content = `# ${chat.title}\n\n`;
        chat.messages.forEach(m => {
          content += `**${m.role === 'user' ? 'Usuario' : 'Maxi IA'}** (${m.time}):\n${m.content}\n\n`;
        });
        downloadFile(content, `chat_${chat.title}.md`, 'text/markdown');
      }
      showToast(`✅ Chat exportado como ${format.toUpperCase()}`);
    }

    function downloadFile(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ------------------------------------------------------------
    // FUNCIÓN PARA LEER ARCHIVOS ADJUNTOS
    // ------------------------------------------------------------
    function readFileContent(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = (e) => reject(e.target.error);
        reader.readAsText(file);
      });
    }

    // ------------------------------------------------------------
    // Eventos UI
    // ------------------------------------------------------------
    async function handleSend() {
      let text = messageInput.value.trim();
      if (!text && fileInput.files.length === 0) return;
      if (state.isProcessing) return;

      // Si hay archivos adjuntos, leerlos y añadirlos al mensaje
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        // Solo leer archivos de texto
        const validTypes = ['text/plain', 'application/json', 'text/javascript', 'text/html', 'text/css', 'text/markdown'];
        if (validTypes.includes(file.type) || file.name.endsWith('.js') || file.name.endsWith('.py') || file.name.endsWith('.md') || file.name.endsWith('.json') || file.name.endsWith('.html') || file.name.endsWith('.css') || file.name.endsWith('.txt')) {
          try {
            const content = await readFileContent(file);
            const fileInfo = `📎 Archivo: ${file.name}\n\nContenido:\n---\n${content}\n---`;
            text = text ? `${text}\n\n${fileInfo}` : fileInfo;
          } catch (err) {
            showToast('❌ Error al leer el archivo.');
            return;
          }
        } else {
          showToast('⚠️ Solo se pueden leer archivos de texto.');
          return;
        }
        // Limpiar input de archivos
        fileInput.value = '';
      }

      if (!text) return;
      if (text.length > 2000) { showToast(t('charLimit')); return; }

      addMessage('user', text);
      messageInput.value = '';
      messageInput.style.height = 'auto';
      messageInput.focus();
      simulateAssistantResponse(text);
    }

    sendBtn.addEventListener('click', handleSend);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
    });

    attachBtn.addEventListener('click', () => fileInput.click());
    // No procesamos archivos aquí, se procesan en handleSend

    // Micrófono (con SVG fijo y clase recording)
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            messageInput.value = transcript;
            messageInput.dispatchEvent(new Event('input'));
            micBtn.classList.remove('recording');
            showToast('🎤 Transcripción completada');
          }
        }
      };
      recognition.onerror = () => {
        micBtn.classList.remove('recording');
        showToast('❌ Error en el micrófono');
      };
      recognition.onend = () => {
        micBtn.classList.remove('recording');
      };
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) { showToast('❌ Tu navegador no soporta reconocimiento de voz'); return; }
      try {
        if (!micBtn.classList.contains('recording')) {
          recognition.start();
          micBtn.classList.add('recording');
          showToast('🎤 Escuchando...');
        } else {
          recognition.stop();
          micBtn.classList.remove('recording');
        }
      } catch (_) {
        try { recognition.stop(); } catch (__) {}
        micBtn.classList.remove('recording');
      }
    });

    // Sidebar
    function toggleSidebar(open) {
      const isOpen = sidebar.classList.contains('open');
      const shouldOpen = open !== undefined ? open : !isOpen;
      sidebar.classList.toggle('open', shouldOpen);
      sidebarOverlay.classList.toggle('visible', shouldOpen);
      menuToggle.setAttribute('aria-expanded', String(shouldOpen));
    }

    menuToggle.addEventListener('click', () => toggleSidebar());
    sidebarOverlay.addEventListener('click', () => toggleSidebar(false));
    navNewChat.addEventListener('click', () => { startNewChat(); toggleSidebar(false); });
    navHistoryToggle.addEventListener('click', () => {
      const isVisible = historyList.style.display !== 'none';
      historyList.style.display = isVisible ? 'none' : 'flex';
      if (!isVisible) renderHistoryList();
    });

    // Configuración
    navSettings.addEventListener('click', async () => {
      toggleSidebar(false);
      const config = await getConfig();
      modalTitle.textContent = '⚙️ ' + t('settings');
      modalContent.innerHTML = '';
      modalExtra.style.display = 'block';
      modalExtraSelect.style.display = 'block';
      modalExtra.innerHTML = `
        <label>${t('theme')}</label>
        <select id="modalThemeSelect">
          <option value="auto">${t('auto')}</option>
          <option value="dark">${t('dark')}</option>
          <option value="light">${t('light')}</option>
        </select>
        <label style="margin-top:12px;display:block;">${t('language')}</label>
        <select id="modalLangSelect">
          <option value="es">Español</option>
          <option value="en">English</option>
          <option value="pt">Português</option>
        </select>
        <label style="margin-top:12px;display:block;">${t('pin')}</label>
        <input type="password" id="modalPinInput" placeholder="${t('setPin')}" maxlength="4" pattern="[0-9]*" inputmode="numeric" />
      `;
      const themeSelect = document.getElementById('modalThemeSelect');
      const langSelect = document.getElementById('modalLangSelect');
      const pinInput = document.getElementById('modalPinInput');
      themeSelect.value = config.theme || 'auto';
      langSelect.value = config.lang || 'es';
      pinInput.value = config.pin || '';

      modalConfirmBtn._action = 'settings';
      modalConfirmBtn._onConfirm = async () => {
        const newTheme = themeSelect.value;
        const newLang = langSelect.value;
        const newPin = pinInput.value.trim();
        document.documentElement.className = newTheme === 'auto' ? '' : newTheme;
        await setConfig('theme', newTheme);
        await setConfig('lang', newLang);
        if (newPin.length === 4 && /^\d{4}$/.test(newPin)) {
          await setConfig('pin', newPin);
          showToast(t('pinEnabled'));
        } else if (newPin === '') {
          await setConfig('pin', '');
          showToast(t('pinDisabled'));
        } else if (newPin.length > 0) {
          showToast('PIN debe ser 4 dígitos.');
          return;
        }
        currentLang = newLang;
        closeModal();
        showToast('✅ Configuración guardada');
      };
      modalOverlay.classList.add('active');
    });

    // Información
    navInfo.addEventListener('click', () => {
      toggleSidebar(false);
      modalTitle.textContent = 'ℹ️ ' + t('info');
      modalContent.innerHTML = `
        <p><strong>Maxi IA</strong> — Especialista en programación</p>
        <p>Versión 2.2 (respuestas cortas + lectura de archivos)</p>
        <p>IA: Pollinations (gratuita)</p>
        <p>Almacenamiento: IndexedDB</p>
        <p style="margin-top:12px;font-size:13px;color:var(--text-muted);">
          💡 <strong>Long press</strong> en un chat del historial para renombrar o eliminar.
        </p>
      `;
      modalExtra.style.display = 'none';
      modalExtraSelect.style.display = 'none';
      modalConfirmBtn._action = null;
      modalOverlay.classList.add('active');
    });

    // Exportar chat
    btnExportChat.addEventListener('click', () => {
      modalTitle.textContent = t('exportChat');
      modalContent.innerHTML = '';
      modalExtra.style.display = 'none';
      modalExtraSelect.style.display = 'block';
      modalSelect.innerHTML = `
        <option value="json">${t('exportJSON')}</option>
        <option value="markdown">${t('exportMarkdown')}</option>
      `;
      modalConfirmBtn._action = 'export';
      modalConfirmBtn._onConfirm = () => {
        const format = modalSelect.value;
        exportChat(format);
        closeModal();
      };
      modalOverlay.classList.add('active');
    });

    // Context menu
    contextRename.addEventListener('click', async () => {
      const chatId = state.contextChatId;
      hideContextMenu();
      if (!chatId) return;
      const chat = await getChat(chatId);
      if (!chat) return;
      modalTitle.textContent = '✏️ ' + t('rename');
      modalContent.textContent = 'Introduce el nuevo nombre para el chat:';
      modalExtra.style.display = 'block';
      modalExtraSelect.style.display = 'none';
      modalInput.value = chat.title;
      modalInput.placeholder = 'Nuevo nombre...';
      modalInput.focus();
      modalInput.select();
      modalConfirmBtn._action = 'rename';
      modalConfirmBtn._chatId = chatId;
      modalConfirmBtn._onConfirm = async () => {
        const newTitle = modalInput.value.trim();
        if (newTitle) {
          await renameChat(chatId, newTitle);
        } else {
          showToast('⚠️ El nombre no puede estar vacío');
          return;
        }
        closeModal();
      };
      modalOverlay.classList.add('active');
    });

    contextDelete.addEventListener('click', async () => {
      const chatId = state.contextChatId;
      hideContextMenu();
      if (!chatId) return;
      const chat = await getChat(chatId);
      if (chat && confirm(t('confirmDelete').replace('{title}', chat.title))) {
        await deleteChatAndRefresh(chatId);
      }
    });

    document.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) hideContextMenu();
    });

    // Modal genérico
    modalCancelBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });
    modalConfirmBtn.addEventListener('click', () => {
      if (modalConfirmBtn._onConfirm) {
        modalConfirmBtn._onConfirm();
      } else {
        closeModal();
      }
    });
    modalInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') modalConfirmBtn.click();
    });

    function closeModal() {
      modalOverlay.classList.remove('active');
      modalExtra.style.display = 'none';
      modalExtraSelect.style.display = 'none';
      modalInput.value = '';
      modalConfirmBtn._action = null;
      modalConfirmBtn._chatId = null;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (modalOverlay.classList.contains('active')) closeModal();
        if (contextMenu.style.display === 'block') hideContextMenu();
        if (sidebar.classList.contains('open')) toggleSidebar(false);
      }
    });

    // PIN al iniciar
    async function checkPin() {
      const config = await getConfig();
      if (config.pin && config.pin.length === 4) {
        return new Promise((resolve) => {
          modalTitle.textContent = '🔒 ' + t('enterPin');
          modalContent.innerHTML = '';
          modalExtra.style.display = 'block';
          modalExtraSelect.style.display = 'none';
          modalInput.type = 'password';
          modalInput.placeholder = '****';
          modalInput.maxLength = 4;
          modalInput.inputMode = 'numeric';
          modalInput.value = '';
          modalInput.focus();
          modalConfirmBtn._action = 'pin';
          modalConfirmBtn._onConfirm = () => {
            const entered = modalInput.value.trim();
            if (entered === config.pin) {
              closeModal();
              resolve(true);
            } else {
              showToast(t('wrongPin'));
              modalInput.value = '';
              modalInput.focus();
            }
          };
          modalOverlay.classList.add('active');
        });
      }
      return true;
    }

    // ------------------------------------------------------------
    // Inicialización
    // ------------------------------------------------------------
    async function init() {
      const config = await getConfig();
      currentLang = config.lang || 'es';
      const theme = config.theme || 'auto';
      if (theme !== 'auto') document.documentElement.className = theme;
      else document.documentElement.className = '';

      const ok = await checkPin();
      if (!ok) return;

      await renderHistoryList();
      if (state.messages.length === 0) welcomeScreen.classList.remove('hidden');
      messageInput.focus();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('[SW] Registrado correctamente'))
          .catch(err => console.warn('[SW] Error al registrar:', err));
      }

      console.log('✨ Maxi IA v2.2 - respuestas cortas + lectura de archivos');
    }

    init();
    window.__maxi = { state, saveCurrentChat, loadChat, deleteChatAndRefresh, renameChat, getAllChats, getConfig, setConfig };
  </script>
</body>
