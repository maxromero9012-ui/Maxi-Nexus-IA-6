<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maxi IA">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.json">
<title>Maxi IA</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',sans-serif; }
body { background:#121212; color:#ececec; height:100vh; overflow:hidden; }

#app-wrapper { display:flex; height:100vh; overflow:hidden; }

/* ── SIDEBAR ── */
#sidebar {
  width:0; overflow:hidden; flex-shrink:0; background:#1a1a1a;
  border-right:1px solid #2a2a2a; transition: width 0.3s ease;
  display:flex; flex-direction:column; padding:0;
}
#sidebar.open { width:280px; padding:14px; }
#sidebar > * { opacity:0; transition: opacity 0.2s ease 0.1s; }
#sidebar.open > * { opacity:1; }

#sidebar .btn-nuevo {
  background:#4dadf7; color:#000; border:none; padding:12px;
  border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer;
  margin-bottom:6px;
}
#sidebar .btn-nuevo:active { background:#2e8fd4; }

#lista-chats {
  flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px;
  margin:6px 0;
}

.item-chat {
  padding:11px 12px; background:#252525; border-radius:8px; cursor:pointer;
  font-size:13px; color:#ccc; border-left:3px solid transparent;
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  user-select:none;
}
.item-chat.activo { background:#2d2d2d; border-left-color:#4dadf7; color:#fff; }
.item-chat:active { background:#333; }
.chat-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat-actions { display:flex; gap:4px; opacity:0; pointer-events:none; transition:0.2s; }
.item-chat:hover .chat-actions,
.item-chat.activo .chat-actions { opacity:1; pointer-events:all; }
.chat-actions button {
  background:none; border:none; cursor:pointer; font-size:13px; padding:2px 4px;
  border-radius:4px; color:#aaa;
}
.chat-actions button:hover { background:#444; color:#fff; }

#sidebar .btn-borrar-todo {
  background:#1e1e1e; color:#ff6666; border:1px solid #333;
  padding:11px; border-radius:8px; font-size:13px; cursor:pointer;
  margin-top:4px;
}
#sidebar .btn-borrar-todo:active { background:#2a0000; }

/* ── MAIN ── */
#main {
  flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden;
}

/* HEADER - VERSIÓN ULTRA ROBUSTA */
header {
  background:#1a1a1a;
  padding: 10px 12px !important;
  border-bottom:1px solid #2a2a2a;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  flex-direction: row !important;
  flex-wrap: nowrap !important;
  min-height: 56px !important;
  gap: 8px !important;
  flex-shrink: 0 !important;
}

#btn-toggle {
  background: #2a2a2a;
  border: 1px solid #444;
  color: #fff;
  font-size: 20px !important;
  cursor: pointer;
  padding: 4px 10px !important;
  border-radius: 6px;
  flex-shrink: 0 !important;
  min-width: 40px !important;
  height: 40px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
}

header h1 {
  font-size: 16px !important;
  color: #4dadf7;
  flex: 1 !important;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 40px !important;
}

.header-btn {
  background: #2a2a2a;
  border: 1px solid #444;
  font-size: 16px !important;
  cursor: pointer;
  padding: 4px 8px !important;
  border-radius: 6px;
  flex-shrink: 0 !important;
  min-width: 44px !important;
  height: 40px !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  transition: 0.2s;
  color: #fff !important;
}
.header-btn:hover { background: #333; }
#btn-borrar-actual { color: #ff6666 !important; }
#btn-borrar-todo-header { color: #ff6666 !important; }

#chat-box {
  flex:1; padding:16px; overflow-y:auto;
  display:flex; flex-direction:column; gap:14px;
  min-height:0; padding-bottom:76px;
}

.msg { max-width:80%; padding:12px 14px; border-radius:14px; line-height:1.6; font-size:14px; word-break:break-word; }
.msg.user { background:#4dadf7; color:#000; align-self:flex-end; border-bottom-right-radius:3px; font-weight:500; }
.msg.ai { background:#1e1e1e; color:#e0e0e0; align-self:flex-start; border:1px solid #2a2a2a; border-bottom-left-radius:3px; }
.msg.ai pre { background:#0d0d0d; padding:10px; border-radius:6px; border-left:3px solid #4dadf7; overflow-x:auto; margin:6px 0; }
.msg.ai code { font-family:'Consolas',monospace; font-size:12.5px; color:#a9b7c6; }
.msg.ai p { margin-bottom:4px; }
.msg.ai strong { color:#4dadf7; }
.msg.ai img { max-width:100%; border-radius:8px; margin:6px 0; }

.typing { display:flex; gap:5px; padding:12px 16px; align-self: flex-start; }
.dot { width:8px; height:8px; background:#4dadf7; border-radius:50%; animation:bounce 1s infinite; }
.dot:nth-child(2) { animation-delay:0.2s; }
.dot:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

/* ── INPUT AREA ── */
.input-area {
  position:fixed; bottom:0; left:0; right:0;
  padding:8px 10px 10px 10px;
  background:#1a1a1a;
  border-top:1px solid #2a2a2a;
  z-index:40;
}
.input-box {
  display:flex; gap:6px; background:#2a2a2a;
  padding:4px 10px; border-radius:30px; align-items:center;
  border:1px solid #444; max-width:800px; margin:0 auto;
}
textarea {
  flex:1; background:transparent; border:none; color:#fff;
  font-size:14px; outline:none; resize:none; max-height:100px;
  line-height:1.4; padding:6px 0; font-family:'Segoe UI',sans-serif;
  min-height:36px;
}
.btn-enviar, .btn-imagen, .btn-microfono {
  border:none; min-width:38px; height:38px;
  border-radius:50%; cursor:pointer; 
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  font-size:16px;
}
.btn-enviar {
  background:#4dadf7; color:#000;
}
.btn-enviar:active { background:#2e8fd4; transform:scale(0.95); }
.btn-enviar:disabled { background:#333; color:#666; cursor:not-allowed; }

.btn-imagen {
  background:linear-gradient(135deg,#8B5CF6,#4A90D9);
  color:#fff;
}
.btn-imagen:active { transform:scale(0.95); }
.btn-imagen:hover { filter:brightness(1.1); }

.btn-microfono {
  background:linear-gradient(135deg,#4A90D9,#06B6D4);
  color:#fff;
}
.btn-microfono:active { transform:scale(0.95); }
.btn-microfono:hover { filter:brightness(1.1); }
.btn-microfono.escuchando {
  background:linear-gradient(135deg,#ff4444,#ff6666);
  animation: parpadeo 0.5s infinite alternate;
}
@keyframes parpadeo {
  0% { opacity: 0.7; transform: scale(1); }
  100% { opacity: 1; transform: scale(1.05); }
}

#modal-wrap {
  position:fixed; inset:0; background:#000000bb;
  display:none; align-items:center; justify-content:center; z-index:1100;
}
#modal-wrap.show { display:flex; }
#modal {
  background:#1e1e1e; border:1px solid #333; border-radius:12px;
  padding:24px; width:300px; display:flex; flex-direction:column; gap:12px;
}
#modal h3 { color:#4dadf7; font-size:15px; }
#modal input {
  background:#2a2a2a; border:1px solid #444; color:#fff;
  padding:10px 14px; border-radius:8px; font-size:14px; outline:none;
}
.modal-btns { display:flex; gap:8px; justify-content:flex-end; }
.modal-btns button {
  padding:8px 18px; border-radius:8px; border:none; cursor:pointer; font-size:13px;
}
#modal-cancel { background:#333; color:#aaa; }
#modal-ok { background:#4dadf7; color:#000; font-weight:bold; }

/* ── RESPONSIVE ── */
@media (max-width:600px) {
  #sidebar.open { width:85%; max-width:300px; }
  header { padding:6px 8px !important; min-height:48px !important; gap:4px !important; }
  #btn-toggle { font-size:16px !important; min-width:34px !important; height:34px !important; padding:2px 6px !important; }
  header h1 { font-size:13px !important; min-width:30px !important; }
  .header-btn { font-size:13px !important; min-width:36px !important; height:34px !important; padding:2px 6px !important; }
  .input-area { padding:4px 6px 6px 6px; }
  .input-box { padding:2px 6px; gap:4px; }
  textarea { font-size:13px; min-height:30px; }
  .btn-enviar, .btn-imagen, .btn-microfono { min-width:32px; height:32px; font-size:13px; }
  #chat-box { padding:10px; }
  .msg { font-size:13px; padding:10px 12px; }
}

/* ── ESTILOS PWA ULTRA ROBUSTOS ── */
@media all and (display-mode: standalone) {
  header {
    padding: 10px 12px !important;
    min-height: 56px !important;
    gap: 8px !important;
    display: flex !important;
    align-items: center !important;
    flex-direction: row !important;
    flex-wrap: nowrap !important;
  }
  #btn-toggle {
    font-size: 20px !important;
    min-width: 40px !important;
    height: 40px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  .header-btn {
    font-size: 16px !important;
    min-width: 44px !important;
    height: 40px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    padding: 4px 8px !important;
  }
  header h1 {
    font-size: 16px !important;
    min-width: 40px !important;
  }
  .btn-microfono, .btn-imagen, .btn-enviar {
    min-width: 38px !important;
    height: 38px !important;
    font-size: 16px !important;
  }
  .input-box { gap: 6px !important; padding: 4px 10px !important; }
  textarea { font-size: 14px !important; min-height: 36px !important; }
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s;">
  <canvas id="splash-icon" width="120" height="120" style="border-radius:24px;margin-bottom:20px;box-shadow:0 0 40px #8B5CF688;"></canvas>
  <div style="color:#fff;font-size:28px;font-weight:bold;letter-spacing:4px;">MAXI IA</div>
  <div style="color:#8B5CF6;font-size:13px;margin-top:6px;letter-spacing:2px;">Tu asistente personal</div>
  <div style="margin-top:30px;display:flex;gap:6px;">
    <div style="width:8px;height:8px;border-radius:50%;background:#4A90D9;animation:pulse 1s infinite;"></div>
    <div style="width:8px;height:8px;border-radius:50%;background:#8B5CF6;animation:pulse 1s 0.2s infinite;"></div>
    <div style="width:8px;height:8px;border-radius:50%;background:#06B6D4;animation:pulse 1s 0.4s infinite;"></div>
  </div>
  <style>@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:0.5}}</style>
</div>

<!-- APP WRAPPER -->
<div id="app-wrapper">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <button class="btn-nuevo" onclick="nuevoChat(); cerrarSidebar();">＋ Nuevo Chat</button>
    <button id="btn-instalar" onclick="instalarApp()" style="display:none;background:linear-gradient(135deg,#4A90D9,#8B5CF6);color:#fff;border:none;padding:11px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:bold;letter-spacing:1px;">📲 Instalar App</button>
    <div id="lista-chats"></div>
    <button class="btn-borrar-todo" onclick="borrarTodo()">🗑 Borrar todo</button>
  </div>

  <!-- MAIN (CHAT) -->
  <div id="main" onclick="cerrarSidebar()">
    <header>
      <button id="btn-toggle" onclick="event.stopPropagation(); toggleSidebar();">☰</button>
      <h1>✦ Maxi IA</h1>
      <button class="header-btn" id="btn-borrar-todo-header" onclick="borrarTodo()" title="Borrar todas las conversaciones">🗑❌</button>
      <button class="header-btn" id="btn-borrar-actual" onclick="borrarChat(chatActual)" title="Borrar esta conversación">🗑</button>
    </header>
    <div id="chat-box"></div>
  </div>
</div>

<!-- INPUT AREA -->
<div class="input-area">
  <div class="input-box">
    <textarea id="userInput" rows="1" placeholder="Escribe, dicta 🎤 o pide imagen 🎨..." onkeydown="teclaEnter(event)" oninput="autoResize(this)"></textarea>
    <button class="btn-microfono" id="btn-microfono" onclick="iniciarVoz()" title="Dictar por voz">🎤</button>
    <button class="btn-imagen" onclick="activarModoImagen()" title="Generar imagen (escribe descripción)">🎨</button>
    <button class="btn-enviar" id="btn-enviar" onclick="enviar()">➤</button>
  </div>
</div>

<!-- MODAL RENOMBRAR -->
<div id="modal-wrap">
  <div id="modal">
    <h3>Renombrar conversación</h3>
    <input type="text" id="modal-input" placeholder="Nuevo nombre...">
    <div class="modal-btns">
      <button id="modal-cancel" onclick="cerrarModal()">Cancelar</button>
      <button id="modal-ok" onclick="confirmarRenombrar()">Guardar</button>
    </div>
  </div>
</div>

<script>
// === SPLASH ===
window.addEventListener('DOMContentLoaded', () => {
  const c = document.getElementById('splash-icon');
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,120,120);
  g.addColorStop(0,'#4A90D9'); g.addColorStop(0.5,'#8B5CF6'); g.addColorStop(1,'#06B6D4');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.roundRect(0,0,120,120,22);
  ctx.fill();
  ctx.fillStyle='#fff';
  ctx.font='bold 68px Segoe UI';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('M',60,65);
  ctx.font='18px serif'; ctx.fillStyle='#ffffff99';
  ctx.fillText('✦',95,28);
  setTimeout(()=>{
    const s=document.getElementById('splash');
    if(s){ s.style.opacity='0'; setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); },500); }
  },1500);
});

// === SERVICE WORKER ===
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

// === PWA INSTALACIÓN ===
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('btn-instalar').style.display = 'block';
});
window.addEventListener('appinstalled', () => {
  document.getElementById('btn-instalar').style.display = 'none';
  deferredPrompt = null;
});
function instalarApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  } else {
    alert('Para instalar:\n1. Toca los 3 puntos arriba en Chrome\n2. Toca "Agregar a pantalla de inicio"');
  }
}

// === ESTADO ===
let chatActual = null;
let historial = {};
let renamingId = null;
let enviando = false;
let modoImagen = false;
const SALUDO = "¡Hola! Soy **Maxi**, tu asistente experto en programación 💻\n\nPuedes pedirme imágenes escribiendo *'quiero una imagen de...'* o usando el botón 🎨. También dictar con el micrófono 🎤.";

// === PERSISTENCIA ===
function guardar() {
  try { localStorage.setItem('maxi_v5', JSON.stringify(historial)); } catch(e){}
}
function cargar() {
  try {
    const d = localStorage.getItem('maxi_v5');
    if (d) historial = JSON.parse(d);
  } catch(e) { historial = {}; }
}

// === DETECTAR IMAGEN ===
function detectarGeneracionImagen(texto) {
  const palabrasClave = ['imagen', 'foto', 'dibujo', 'ilustración', 'imagen de', 'foto de', 'genera', 'crea', 'dibuja', 'pintar'];
  const textoLower = texto.toLowerCase();
  for (let palabra of palabrasClave) {
    if (textoLower.includes(palabra)) return true;
  }
  return false;
}

// === GENERAR IMAGEN ===
async function generarImagen(prompt) {
  try {
    const promptLimpio = prompt.replace(/imagen|foto|dibujo|ilustración|genera|crea|dibuja|pintar/gi, '').trim();
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptLimpio || prompt)}`;
    return url;
  } catch (error) {
    console.error('Error generando imagen:', error);
    return null;
  }
}

// === CHATS ===
function nuevoChat() {
  const id = 'c' + Date.now();
  historial[id] = { nombre: 'Nueva conversación', mensajes: [{ rol:'ai', texto: SALUDO }] };
  guardar();
  abrirChat(id);
  renderSidebar();
  cerrarSidebar();
}

function abrirChat(id) {
  chatActual = id;
  renderSidebar();
  renderChat();
}

function renombrarChat(id) {
  if (!id || !historial[id]) return;
  renamingId = id;
  document.getElementById('modal-input').value = historial[id].nombre;
  document.getElementById('modal-wrap').classList.add('show');
  setTimeout(() => document.getElementById('modal-input').focus(), 100);
}

function confirmarRenombrar() {
  const val = document.getElementById('modal-input').value.trim();
  if (val && renamingId) {
    historial[renamingId].nombre = val;
    guardar(); renderSidebar();
  }
  cerrarModal();
}

function cerrarModal() {
  document.getElementById('modal-wrap').classList.remove('show');
  renamingId = null;
}

function borrarChat(id) {
  if (!id || !historial[id]) return;
  if (!confirm(`¿Eliminar la conversación "${historial[id].nombre}"?`)) return;
  delete historial[id];
  guardar();
  if (chatActual === id) {
    const ids = Object.keys(historial);
    if (ids.length > 0) abrirChat(ids[ids.length-1]);
    else nuevoChat();
  } else renderSidebar();
}

function borrarTodo() {
  if (!confirm('¿Borrar todas las conversaciones?')) return;
  historial = {};
  guardar();
  nuevoChat();
}

function renderSidebar() {
  const lista = document.getElementById('lista-chats');
  lista.innerHTML = '';
  const ids = Object.keys(historial).reverse();
  ids.forEach(id => {
    const div = document.createElement('div');
    div.className = 'item-chat' + (id === chatActual ? ' activo' : '');
    const title = document.createElement('span');
    title.className = 'chat-title';
    title.textContent = historial[id].nombre;
    title.onclick = (e) => { e.stopPropagation(); abrirChat(id); cerrarSidebar(); };
    const actions = document.createElement('div');
    actions.className = 'chat-actions';
    const btnR = document.createElement('button');
    btnR.textContent = '✏️';
    btnR.onclick = (e) => { e.stopPropagation(); renombrarChat(id); };
    const btnD = document.createElement('button');
    btnD.textContent = '🗑';
    btnD.onclick = (e) => { e.stopPropagation(); borrarChat(id); };
    actions.append(btnR, btnD);
    div.append(title, actions);
    lista.appendChild(div);
  });
}

function formatear(texto) {
  if (!texto) return '';
  let h = texto
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => `<pre><code>${c.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
  return h;
}

function renderChat() {
  const box = document.getElementById('chat-box');
  box.innerHTML = '';
  if (!chatActual || !historial[chatActual]) return;
  historial[chatActual].mensajes.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + m.rol;
    div.innerHTML = formatear(m.texto);
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function addMsg(rol, texto) {
  historial[chatActual].mensajes.push({ rol, texto });
  guardar();
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'msg ' + rol;
  div.innerHTML = formatear(texto);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function addImageMsg(rol, imageUrl, prompt) {
  const texto = `<img src="${imageUrl}" alt="${prompt}" loading="lazy"><br><em>🖼️ Imagen generada: ${prompt}</em>`;
  historial[chatActual].mensajes.push({ rol, texto });
  guardar();
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'msg ' + rol;
  div.innerHTML = texto;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function showTyping() {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'msg ai typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// === ACTIVAR MODO IMAGEN ===
function activarModoImagen() {
  const input = document.getElementById('userInput');
  input.focus();
  input.value = '🎨 Genera una imagen de ';
  input.setSelectionRange(input.value.length, input.value.length);
  modoImagen = true;
}

// === RECONOCIMIENTO DE VOZ ===
let reconocimiento = null;
let escuchando = false;

function iniciarVoz() {
  const btn = document.getElementById('btn-microfono');
  if (escuchando && reconocimiento) {
    reconocimiento.stop();
    escuchando = false;
    btn.classList.remove('escuchando');
    btn.textContent = '🎤';
    return;
  }
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Tu navegador no soporta reconocimiento de voz. Prueba con Chrome o Edge.');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  reconocimiento = new SR();
  reconocimiento.lang = 'es-ES';
  reconocimiento.continuous = false;
  reconocimiento.interimResults = true;
  reconocimiento.maxAlternatives = 1;

  reconocimiento.onstart = () => {
    escuchando = true;
    btn.classList.add('escuchando');
    btn.textContent = '⏹️';
    document.getElementById('userInput').placeholder = '🎤 Escuchando...';
  };
  reconocimiento.onresult = (event) => {
    const input = document.getElementById('userInput');
    let final = '';
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) final += event.results[i][0].transcript;
      else interim += event.results[i][0].transcript;
    }
    if (final) { input.value = final; modoImagen = false; }
    else if (interim) input.value = interim;
    input.dispatchEvent(new Event('input'));
  };
  reconocimiento.onerror = (event) => {
    if (event.error === 'not-allowed') alert('Permite el acceso al micrófono.');
    detenerVoz();
  };
  reconocimiento.onend = detenerVoz;
  reconocimiento.start();
}

function detenerVoz() {
  const btn = document.getElementById('btn-microfono');
  escuchando = false;
  btn.classList.remove('escuchando');
  btn.textContent = '🎤';
  const input = document.getElementById('userInput');
  if (input.placeholder === '🎤 Escuchando...') {
    input.placeholder = 'Escribe, dicta 🎤 o pide imagen 🎨...';
  }
  if (reconocimiento) {
    try { reconocimiento.abort(); } catch(e) {}
    reconocimiento = null;
  }
}

// === ENVIAR ===
async function enviar() {
  if (enviando) return;
  if (escuchando) detenerVoz();

  const inp = document.getElementById('userInput');
  let texto = inp.value.trim();
  if (!texto) return;

  let esImagen = modoImagen || detectarGeneracionImagen(texto);
  modoImagen = false;

  inp.value = '';
  inp.style.height = 'auto';
  enviando = true;
  document.getElementById('btn-enviar').disabled = true;

  // Auto-título
  if (historial[chatActual].mensajes.length === 1) {
    fetch(`https://text.pollinations.ai/${encodeURIComponent('Dame un título corto de máximo 3 palabras en español para esta consulta: "' + texto + '". Solo el título sin comillas.')}`)
      .then(r => r.text())
      .then(nombre => {
        if (nombre && nombre.length > 2 && nombre.length < 30) {
          historial[chatActual].nombre = nombre.trim();
        } else {
          historial[chatActual].nombre = texto.slice(0,25) + '...';
        }
        guardar(); renderSidebar();
      })
      .catch(() => {
        historial[chatActual].nombre = texto.slice(0,25) + '...';
        guardar(); renderSidebar();
      });
  }

  addMsg('user', texto);

  if (esImagen) {
    showTyping();
    const imageUrl = await generarImagen(texto);
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
    if (imageUrl) addImageMsg('ai', imageUrl, texto);
    else addMsg('ai', '❌ No pude generar la imagen. Intenta con otra descripción.');
    enviando = false;
    document.getElementById('btn-enviar').disabled = false;
    inp.focus();
    return;
  }

  showTyping();
  const msgs = [
    { role: 'system', content: 'Eres Maxi, una IA experta en programación y desarrollo web. Responde de forma clara, directa y en español.' }
  ];
  historial[chatActual].mensajes.forEach(m => {
    msgs.push({
      role: (m.rol === 'user') ? 'user' : 'assistant',
      content: m.texto
    });
  });

  try {
    const r = await fetch('https://text.pollinations.ai/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: msgs,
        private: true,
        cache: false
      })
    });
    let respuesta = null;
    if (r.ok) respuesta = await r.text();
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
    addMsg('ai', respuesta || 'No obtuve una respuesta clara de la API. Intenta de nuevo.');
  } catch (err) {
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
    addMsg('ai', '⚠️ Error de conexión con el núcleo de la IA. Comprueba tu red.');
  }

  enviando = false;
  document.getElementById('btn-enviar').disabled = false;
  inp.focus();
}

// === UI ===
function teclaEnter(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function cerrarSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}
document.getElementById('modal-wrap').addEventListener('click', function(e) {
  if (e.target === this) cerrarModal();
});

// === INICIO ===
cargar();
if (Object.keys(historial).length === 0) {
  nuevoChat();
} else {
  const ids = Object.keys(historial);
  abrirChat(ids[ids.length - 1]);
}
</script>
